
name: Project64 Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build UpdateVersion x86
        shell: cmd
        run: |
          msbuild Source\UpdateVersion\UpdateVersion.vcxproj /p:Configuration=Release /p:Platform=Win32

      - name: Build Project64 x86
        shell: cmd
        run: |
          msbuild Source\Project64\Project64.vcxproj /m /p:Configuration=Release /p:Platform=Win32

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Project64-Windows-x86
          path: |
            Bin/Win32/Release/**
            Plugin/Win32/**
            Config/**
            Lang/**
          if-no-files-found: warn
